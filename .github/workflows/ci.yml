name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - chore/bot-hosting-deployment
  pull_request:
    branches:
      - main

jobs:
  validate-build:
    name: Typecheck and Build on Node 24
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar Dependencias Limpias (npm ci)
        run: npm ci

      - name: Compilar TypeScript (npm run build)
        run: npm run build

      - name: Verificar Existencia del Artefacto de Entrada (dist/bot.js)
        run: |
          if [ ! -f "dist/bot.js" ]; then
            echo "ERROR: dist/bot.js no fue generado durante la compilación."
            exit 1
          fi
          echo "✔ Artefacto dist/bot.js verificado exitosamente."
